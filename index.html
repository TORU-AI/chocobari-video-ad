<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chocobari 広告動画｜店舗別ダウンロード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0e14;
      min-height: 100vh;
      padding: 56px 32px 80px;
      font-family: 'Noto Sans JP', sans-serif;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    header h1 {
      font-family: 'Noto Serif JP', serif;
      font-weight: 200;
      font-size: 24px;
      letter-spacing: 0.35em;
      color: rgba(248,248,246,0.55);
      margin-bottom: 10px;
    }

    header p {
      font-size: 12px;
      letter-spacing: 0.15em;
      color: rgba(248,248,246,0.25);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 32px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #111620;
      border: 1px solid rgba(248,248,246,0.08);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: rgba(200,160,96,0.4);
    }

    /* 9:16 縦動画（Reels・Stories） */
    .card-preview {
      width: 100%;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #0d1119;
      position: relative;
    }

    /* 1:1 正方形動画の場合は .card-preview.square を使う */
    .card-preview.square {
      aspect-ratio: 1 / 1;
    }

    /* 16:9 横動画の場合は .card-preview.landscape を使う */
    .card-preview.landscape {
      aspect-ratio: 16 / 9;
    }

    .card-preview iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* まだ動画未設定のカード用プレースホルダー */
    .card-preview .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(248,248,246,0.2);
    }

    .card-preview .placeholder svg {
      width: 40px;
      height: 40px;
      opacity: 0.3;
    }

    .card-preview .placeholder span {
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    .card-preview .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(10,12,18,0.75);
      border: 1px solid rgba(248,248,246,0.12);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: rgba(248,248,246,0.45);
      backdrop-filter: blur(6px);
      z-index: 1;
    }

    .card-body {
      padding: 20px 20px 22px;
    }

    .card-station {
      font-family: 'Noto Serif JP', serif;
      font-weight: 200;
      font-size: 20px;
      letter-spacing: 0.2em;
      color: rgba(248,248,246,0.85);
      margin-bottom: 16px;
    }

    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 0;
      background: linear-gradient(135deg, #c8a060 0%, #b88c48 100%);
      border: none;
      border-radius: 7px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: #fff8e8;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn-download:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .btn-download:active {
      transform: translateY(0);
      opacity: 1;
    }

    .btn-download.disabled {
      background: linear-gradient(135deg, #3a3a3a 0%, #2a2a2a 100%);
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-download svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .card-meta {
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: rgba(248,248,246,0.2);
      text-align: center;
    }
  </style>
</head>
